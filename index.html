<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards for sale</title>
<style>
:root { --bg: #f6f5f1; --panel: #fff; --ink: #1d1d1b; --muted: #6b6a63; --line: #e2e0d8; --accent: #2456d6; --accent-ink: #fff; --chip: #eeece5; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9c9a92; --line: #33322e; --accent: #6d93ff; --accent-ink: #0d0d0c; --chip: #2a2a27; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding-bottom: 90px; }
header { padding: 20px 16px 8px; max-width: 1180px; margin: 0 auto; }
h1 { margin: 0 0 4px; font-size: 24px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.note { white-space: pre-line; margin: 8px 0 0; }
.post { margin: 6px 0 0; font-weight: 600; }
.nudge { color: var(--muted); font-size: 13px; }
.dm { display: inline-block; margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.dm button { margin-left: 6px; padding: 3px 9px; }
.dm b { font-family: ui-monospace, Menlo, monospace; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 12px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.controls { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 10px 16px; max-width: 1180px; margin: 0 auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=search], select { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
input[type=search] { flex: 1 1 200px; min-width: 0; }
select { max-width: 100%; }
#set.on { border-color: var(--accent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 5px 10px; border-radius: 999px; background: var(--chip); border: 1px solid transparent; font-size: 13px; }
.chip.on { background: var(--accent); color: var(--accent-ink); }
main { max-width: 1180px; margin: 0 auto; padding: 0 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.card.picked { outline: 2px solid var(--accent); }
.pic { position: relative; aspect-ratio: 5 / 7; background: var(--chip); cursor: pointer; }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.flip { position: absolute; right: 6px; bottom: 6px; font-size: 11px; background: rgba(0,0,0,.55); color: #fff; padding: 2px 7px; border-radius: 999px; }
.body { padding: 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.name { font-weight: 700; line-height: 1.25; }
.meta { font-size: 12.5px; color: var(--muted); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11px; background: var(--chip); border-radius: 999px; padding: 1px 7px; }
.row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 6px; }
.price { font-size: 18px; font-weight: 800; }
.sku { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
.empty { grid-column: 1 / -1; text-align: center; padding: 40px 0; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; z-index: 4; }
.bar[hidden] { display: none; }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; z-index: 5; max-width: 90vw; }
footer { text-align: center; padding: 24px 16px; }
.name-btn { all: unset; cursor: pointer; font-weight: 700; line-height: 1.25; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
.name-btn:hover, .name-btn:focus-visible { color: var(--accent); }
body.lb-open { overflow: hidden; }
.lb { position: fixed; inset: 0; z-index: 6; background: rgba(0,0,0,.9); display: flex; align-items: center; justify-content: center; padding: 16px; }
.lb-box { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 100%; max-height: 100%; }
.lb-pic { position: relative; }
.lb-pic img { display: block; max-width: min(92vw, 640px); max-height: calc(100dvh - 170px); width: auto; height: auto; border-radius: 12px; background: var(--chip); touch-action: pinch-zoom; }
.lb-info { color: #fff; text-align: center; }
.lb-info .name { font-size: 17px; }
.lb-info .meta { color: #cfcdc5; }
.lb-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.lb-close { position: fixed; top: 10px; right: 10px; font-size: 20px; line-height: 1; padding: 8px 12px; z-index: 7; }
.lb-nav { position: fixed; top: 50%; transform: translateY(-50%); font-size: 22px; padding: 10px 14px; z-index: 7; opacity: .9; }
.lb-prev { left: 8px; } .lb-next { right: 8px; }
@media (max-width: 600px) { .lb-nav { top: auto; bottom: 14px; transform: none; } }
</style>
</head>

<main id="grid"></main>
<footer class="muted small" id="count"></footer>
<div class="bar" id="bar" hidden>

</div>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const money = v => `$${Number(v).toFixed(2)}`;
const BANDS = [["All", 0, Infinity], ["Under $5", 0, 5], ["$5–20", 5, 20], ["$20–50", 20, 50], ["$50+", 50, Infinity]];
let band = 0, shown = [];
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } } };
const skus = new Set(DATA.cards.map(c => c.sku));
let picked = new Set(store.get("picked", []).filter(s => skus.has(s)));   // drop cards that have since sold

document.title = DATA.title;
$("#title").textContent = DATA.title;
$("#updated").textContent = `${DATA.cards.length} card(s) · updated ${DATA.updated}`;
$("#note").textContent = DATA.note;
const PRICES = DATA.show_prices !== false;      // off: prices live in the Discord post, the page is photos + SKUs
if (!PRICES) { $("#bands").hidden = true; document.querySelectorAll('#sort option[value^="price"]').forEach(o => o.remove()); }
const POST = PRICES ? (DATA.postage || { fee: 0, free_from: 0 }) : { fee: 0, free_from: 0 };
function postage(total) { return !POST.fee || (POST.free_from && total >= POST.free_from - 1e-9) ? 0 : POST.fee; }
if (POST.fee) {
  $("#post").hidden = false;
  $("#post").textContent = `Postage ${money(POST.fee)}` + (POST.free_from ? ` · free on orders of ${money(POST.free_from)} or more` : "");
}
if (DATA.discord) { $("#dm").hidden = false; $("#handle").textContent = DATA.discord; }
// Set filter: one option per set with its card count; #set=<name> in the URL opens straight on that set (shareable).
const SETS = [...DATA.cards.reduce((m, c) => m.set(c.set, (m.get(c.set) || 0) + 1), new Map())].sort((a, b) => a[0].localeCompare(b[0]));
$("#set").innerHTML = `<option value="">All sets (${DATA.cards.length})</option>` +
  SETS.map(([s, n]) => `<option value="${esc(s)}">${esc(s || "Other")} (${n})</option>`).join("");
$("#set").hidden = SETS.length < 2;
function setFromHash() {
  const h = decodeURIComponent((location.hash.match(/^#set=(.*)$/) || [])[1] || "");
  $("#set").value = SETS.some(([s]) => s === h) ? h : "";
  $("#set").classList.toggle("on", !!$("#set").value);
}
setFromHash();
$("#bands").innerHTML = BANDS.map(([l], i) => `<button class="chip${i === 0 ? " on" : ""}" data-i="${i}">${l}</button>`).join("");

function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2600); }
function copy(text, ok) {
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(ok)).catch(() => { prompt("Copy this:", text); });
}

function render() {
  const q = $("#q").value.trim().toLowerCase(), [, lo, hi] = BANDS[band], s = $("#sort").value, set = $("#set").value;
  let list = DATA.cards.filter(c => (!PRICES || (c.price >= lo && c.price < hi)) && (!set || c.set === set) &&
    (!q || `${c.name} ${c.set} ${c.number} ${c.sku} ${c.rarity} ${c.finish}`.toLowerCase().includes(q)));
  const by = { price_desc: (a, b) => b.price - a.price, price_asc: (a, b) => a.price - b.price, name: (a, b) => a.name.localeCompare(b.name),
               set: (a, b) => a.set.localeCompare(b.set) || a.number.localeCompare(b.number, undefined, { numeric: true }) };
  list = [...list].sort(by[s]);
  shown = list;
  $("#grid").innerHTML = list.length ? list.map(c => `
    <article class="card${picked.has(c.sku) ? " picked" : ""}" data-sku="${esc(c.sku)}">
      <div class="pic" data-side="0">${c.imgs[0] ? `<img src="${esc(c.imgs[0])}" alt="${esc(c.name)}" loading="lazy">` : ""}
        ${c.imgs[1] ? `<span class="flip">tap: back</span>` : ""}</div>
      <div class="body">
        <button class="name-btn" title="View larger">${esc(c.name)}</button>
        <div class="meta">${esc(c.set)} · ${esc(c.number)}</div>
        <div class="tags">${[c.rarity, c.finish, c.condition, c.language && c.language !== "English" ? c.language : ""].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        <div class="row"><span class="price">${PRICES ? money(c.price) : ""}</span>
          <button class="${picked.has(c.sku) ? "primary" : ""} pick">${picked.has(c.sku) ? "Added ✓" : "Add"}</button></div>
        <div class="sku">${esc(c.sku)}</div>
      </div>
    </article>`).join("") : `<p class="empty muted">Nothing matches.</p>`;
  $("#count").textContent = `Showing ${list.length} of ${DATA.cards.length}`;
  updateBar();
}

function updateBar() {
  const cards = DATA.cards.filter(c => picked.has(c.sku)), total = cards.reduce((t, c) => t + c.price, 0);
  $("#bar").hidden = !cards.length;
  const post = postage(total), short = POST.fee && POST.free_from ? POST.free_from - total : 0;
  if (!PRICES) { $("#sel").textContent = `${cards.length} card(s) picked`; store.set("picked", [...picked]); return; }
  $("#sel").innerHTML = `${cards.length} card(s) · ${money(total)}` +
    (POST.fee ? (post ? ` + ${money(post)} postage = <b>${money(total + post)}</b>` : ` · <b>free postage</b>`) : "") +
    (post && short > 0 ? ` <span class="nudge">· add ${money(short)} for free postage</span>` : "");
  store.set("picked", [...picked]);
}

$("#grid").addEventListener("click", e => {
  const art = e.target.closest(".card"); if (!art) return;
  const c = DATA.cards.find(x => x.sku === art.dataset.sku);
  if (e.target.closest(".pic") && c.imgs[1]) {
    const pic = e.target.closest(".pic"), side = pic.dataset.side === "0" ? 1 : 0;
    pic.dataset.side = side; pic.querySelector("img").src = c.imgs[side];
    pic.querySelector(".flip").textContent = side ? "tap: front" : "tap: back";
  } else if (e.target.closest(".name-btn")) {
    openLb(c.sku);
  } else if (e.target.closest(".pick")) {
    picked.has(c.sku) ? picked.delete(c.sku) : picked.add(c.sku); render();
  }
});

// Large view. Opens over the page (nothing reloads; picks, filters and scroll stay). The phone/browser Back
// button closes it instead of leaving the page.
let lbSku = null, lbSide = 0;
function lbShow() {
  const c = DATA.cards.find(x => x.sku === lbSku); if (!c) return closeLb();
  const img = $("#lb-img"), src = c.imgs[lbSide] || c.imgs[0];
  img.hidden = !src; if (src) { img.src = src; img.alt = `${c.name}${lbSide ? " (back)" : ""}`; }
  $("#lb-name").textContent = c.name;
  $("#lb-meta").textContent = [`${c.set} · ${c.number}`, c.rarity, c.finish, c.condition, c.sku].filter(Boolean).join(" · ");
  $("#lb-flip").hidden = !c.imgs[1]; $("#lb-flip").textContent = lbSide ? "Show front" : "Show back";
  const on = picked.has(c.sku);
  $("#lb-pick").textContent = on ? "Added ✓" : "Add"; $("#lb-pick").className = on ? "primary" : "";
  const i = shown.findIndex(x => x.sku === lbSku);
  $("#lb-prev").hidden = i <= 0; $("#lb-next").hidden = i < 0 || i >= shown.length - 1;
}
function openLb(sku) {
  if (!lbSku) { try { history.pushState({ lb: 1 }, "", location.href); } catch (e) { /* file:// */ } }
  lbSku = sku; lbSide = 0; $("#lb").hidden = false; document.body.classList.add("lb-open"); lbShow(); $("#lb-close").focus();
}
function closeLb(fromHistory) {
  if (!lbSku) return;
  const sku = lbSku; lbSku = null; $("#lb").hidden = true; document.body.classList.remove("lb-open");
  if (!fromHistory && history.state && history.state.lb) history.back();
  const btn = document.querySelector(`.card[data-sku="${CSS.escape(sku)}"] .name-btn`); if (btn) btn.focus({ preventScroll: true });
}
function stepLb(d) {
  const i = shown.findIndex(x => x.sku === lbSku), n = shown[i + d];
  if (i >= 0 && n) { lbSku = n.sku; lbSide = 0; lbShow(); }
}
$("#lb").addEventListener("click", e => { if (e.target === e.currentTarget || e.target.classList.contains("lb-box")) closeLb(); });   // tap the dark area
$("#lb-close").onclick = () => closeLb();
$("#lb-prev").onclick = () => stepLb(-1);
$("#lb-next").onclick = () => stepLb(1);
$("#lb-flip").onclick = () => { lbSide = lbSide ? 0 : 1; lbShow(); };
$("#lb-img").addEventListener("click", () => { const c = DATA.cards.find(x => x.sku === lbSku); if (c && c.imgs[1]) { lbSide = lbSide ? 0 : 1; lbShow(); } });
$("#lb-pick").onclick = () => { picked.has(lbSku) ? picked.delete(lbSku) : picked.add(lbSku); render(); lbShow(); };
document.addEventListener("keydown", e => {
  if (!lbSku) return;
  if (e.key === "Escape") closeLb(); else if (e.key === "ArrowLeft") stepLb(-1); else if (e.key === "ArrowRight") stepLb(1);
});
window.addEventListener("popstate", () => { if (lbSku) closeLb(true); });
$("#bands").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  band = Number(b.dataset.i); document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); render();
});
$("#q").addEventListener("input", render);
$("#sort").addEventListener("change", render);
$("#set").addEventListener("change", () => {
  const v = $("#set").value;
  try { history.replaceState(null, "", v ? `#set=${encodeURIComponent(v)}` : location.pathname + location.search); } catch (e) { /* file:// */ }
  $("#set").classList.toggle("on", !!v); render(); window.scrollTo(0, 0);
});

$("#clear").onclick = () => { picked.clear(); render(); };
$("#copy-handle").onclick = () => copy(DATA.discord, "Discord name copied");
$("#copy").onclick = () => {
  const cards = DATA.cards.filter(c => picked.has(c.sku)), total = cards.reduce((t, c) => t + c.price, 0);
  const lines = cards.map(c => `- ${c.sku} ${c.name} (${c.set} ${c.number}${c.finish ? ", " + c.finish : ""})${PRICES ? " " + money(c.price) : ""}`);
  const post = postage(total), n = `${cards.length} card${cards.length > 1 ? "s" : ""}`;
  const sum = !PRICES ? `(${n})` : POST.fee ? `Cards: ${money(total)} (${n})\nPostage: ${post ? money(post) : "free"}\nTotal: ${money(total + post)}`
                       : `Total: ${money(total)} (${n})`;
  copy(`Hi! I'd like these cards:\n${lines.join("\n")}\n${sum}`,
       DATA.discord ? `Order copied - paste it in a DM to ${DATA.discord}` : "Order copied - paste it in a DM");
};
render();
</script>
</body>
</html>
