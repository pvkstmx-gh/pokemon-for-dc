<title>Cards for sale</title>
<style>
:root { --bg: #f6f5f1; --panel: #fff; --ink: #1d1d1b; --muted: #6b6a63; --line: #e2e0d8; --accent: #2456d6; --accent-ink: #fff; --chip: #eeece5; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9c9a92; --line: #33322e; --accent: #6d93ff; --accent-ink: #0d0d0c; --chip: #2a2a27; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding-bottom: 90px; }
header { padding: 20px 16px 8px; max-width: 1180px; margin: 0 auto; }
h1 { margin: 0 0 4px; font-size: 24px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.note { white-space: pre-line; margin: 8px 0 0; }
.dm { display: inline-block; margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.dm button { margin-left: 6px; padding: 3px 9px; }
.dm b { font-family: ui-monospace, Menlo, monospace; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 12px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.controls { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 10px 16px; max-width: 1180px; margin: 0 auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=search], select { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
input[type=search] { flex: 1 1 200px; min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 5px 10px; border-radius: 999px; background: var(--chip); border: 1px solid transparent; font-size: 13px; }
.chip.on { background: var(--accent); color: var(--accent-ink); }
main { max-width: 1180px; margin: 0 auto; padding: 0 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.card.picked { outline: 2px solid var(--accent); }
.pic { position: relative; aspect-ratio: 5 / 7; background: var(--chip); cursor: pointer; }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.flip { position: absolute; right: 6px; bottom: 6px; font-size: 11px; background: rgba(0,0,0,.55); color: #fff; padding: 2px 7px; border-radius: 999px; }
.body { padding: 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.name { font-weight: 700; line-height: 1.25; }
.meta { font-size: 12.5px; color: var(--muted); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11px; background: var(--chip); border-radius: 999px; padding: 1px 7px; }
.row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 6px; }
.price { font-size: 18px; font-weight: 800; }
.sku { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
.empty { grid-column: 1 / -1; text-align: center; padding: 40px 0; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; z-index: 4; }
.bar[hidden] { display: none; }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; z-index: 5; max-width: 90vw; }
footer { text-align: center; padding: 24px 16px; }
</style>
</head>

nguage": "English", "price": 3.95, "imgs": ["img/S0049_front.jpg", "img/S0049_back.jpg"]}, {"sku": "S0051", "name": "Daisy's Help", "set": "151", "number": "158/165", "rarity": "Uncommon", "finish": "", "condition": "NM", "language": "English", "price": 3.95, "imgs": ["img/S0051_front.jpg", "img/S0051_back.jpg"]}, {"sku": "S0052", "name": "Energy Sticker", "set": "151", "number": "159/165", "rarity": "Uncommon", "finish": "", "condition": "NM", "language": "English", "price": 7.95, "imgs": ["img/S0052_front.jpg", "img/S0052_back.jpg"]}, {"sku": "S0055", "name": "Erika's Invitation", "set": "151", "number": "160/165", "rarity": "Uncommon", "finish": "", "condition": "NM", "language": "English", "price": 3.95, "imgs": ["img/S0055_front.jpg", "img/S0055_back.jpg"]}, {"sku": "S0054", "name": "Erika's Invitation", "set": "151", "number": "160/165", "rarity": "Uncommon", "finish": "", "condition": "NM", "language": "English", "price": 3.95, "imgs": ["img/S0054_front.jpg", "img/S0054_back.jpg"]}, {"sku": "S0058", "name": "Giovanni's Charisma", "set": "151", "number": "161/165", "rarity": "Uncommon", "finish": "", "condition": "NM", "language": "English", "price": 7.95, "imgs": ["img/S0058_front.jpg", "img/S0058_back.jpg"]}, {"sku": "S0016", "name": "Grabber", "set": "151", "number": "162/165", "rarity": "Uncommon", "finish": "", "condition": "NM", "language": "English", "price": 7.95, "imgs": ["img/S0016_front.jpg", "img/S0016_back.jpg"]}, {"sku": "S0053", "name": "Leftovers", "set": "151", "number": "163/165", "rarity": "Uncommon", "finish": "", "condition": "NM", "language": "English", "price": 3.95, "imgs": ["img/S0053_front.jpg", "img/S0053_back.jpg"]}, {"sku": "S0057", "name": "Rigid Band", "set": "151", "number": "165/165", "rarity": "Uncommon", "finish": "", "condition": "NM", "language": "English", "price": 3.95, "imgs": ["img/S0057_front.jpg", "img/S0057_back.jpg"]}, {"sku": "S0056", "name": "Rigid Band", "set": "151", "number": "165/165", "rarity": "Uncommon", "finish": "", "condition": "NM", "language": "English", "price": 3.95, "imgs": ["img/S0056_front.jpg", "img/S0056_back.jpg"]}]};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const money = v => `$${Number(v).toFixed(2)}`;
const BANDS = [["All", 0, Infinity], ["Under $5", 0, 5], ["$5–20", 5, 20], ["$20–50", 20, 50], ["$50+", 50, Infinity]];
let band = 0;
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } } };
const skus = new Set(DATA.cards.map(c => c.sku));
let picked = new Set(store.get("picked", []).filter(s => skus.has(s)));   // drop cards that have since sold

document.title = DATA.title;
$("#title").textContent = DATA.title;
$("#updated").textContent = `${DATA.cards.length} card(s) · updated ${DATA.updated}`;
$("#note").textContent = DATA.note;
if (DATA.discord) { $("#dm").hidden = false; $("#handle").textContent = DATA.discord; }
$("#bands").innerHTML = BANDS.map(([l], i) => `<button class="chip${i === 0 ? " on" : ""}" data-i="${i}">${l}</button>`).join("");

function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2600); }
function copy(text, ok) {
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(ok)).catch(() => { prompt("Copy this:", text); });
}

function render() {
  const q = $("#q").value.trim().toLowerCase(), [, lo, hi] = BANDS[band], s = $("#sort").value;
  let list = DATA.cards.filter(c => c.price >= lo && c.price < hi &&
    (!q || `${c.name} ${c.set} ${c.number} ${c.sku} ${c.rarity} ${c.finish}`.toLowerCase().includes(q)));
  const by = { price_desc: (a, b) => b.price - a.price, price_asc: (a, b) => a.price - b.price, name: (a, b) => a.name.localeCompare(b.name),
               set: (a, b) => a.set.localeCompare(b.set) || a.number.localeCompare(b.number, undefined, { numeric: true }) };
  list = [...list].sort(by[s]);
  $("#grid").innerHTML = list.length ? list.map(c => `
    <article class="card${picked.has(c.sku) ? " picked" : ""}" data-sku="${esc(c.sku)}">
      <div class="pic" data-side="0">${c.imgs[0] ? `<img src="${esc(c.imgs[0])}" alt="${esc(c.name)}" loading="lazy">` : ""}
        ${c.imgs[1] ? `<span class="flip">tap: back</span>` : ""}</div>
      <div class="body">
        <div class="name">${esc(c.name)}</div>
        <div class="meta">${esc(c.set)} · ${esc(c.number)}</div>
        <div class="tags">${[c.rarity, c.finish, c.condition, c.language && c.language !== "English" ? c.language : ""].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        <div class="row"><span class="price">${money(c.price)}</span>
          <button class="${picked.has(c.sku) ? "primary" : ""} pick">${picked.has(c.sku) ? "Added ✓" : "Add"}</button></div>
        <div class="sku">${esc(c.sku)}</div>
      </div>
    </article>`).join("") : `<p class="empty muted">Nothing matches.</p>`;
  $("#count").textContent = `Showing ${list.length} of ${DATA.cards.length}`;
  updateBar();
}

function updateBar() {
  const cards = DATA.cards.filter(c => picked.has(c.sku)), total = cards.reduce((t, c) => t + c.price, 0);
  $("#bar").hidden = !cards.length;
  $("#sel").textContent = `${cards.length} card(s) · ${money(total)}`;
  store.set("picked", [...picked]);
}

$("#grid").addEventListener("click", e => {
  const art = e.target.closest(".card"); if (!art) return;
  const c = DATA.cards.find(x => x.sku === art.dataset.sku);
  if (e.target.closest(".pic") && c.imgs[1]) {
    const pic = e.target.closest(".pic"), side = pic.dataset.side === "0" ? 1 : 0;
    pic.dataset.side = side; pic.querySelector("img").src = c.imgs[side];
    pic.querySelector(".flip").textContent = side ? "tap: front" : "tap: back";
  } else if (e.target.closest(".pick")) {
    picked.has(c.sku) ? picked.delete(c.sku) : picked.add(c.sku); render();
  }
});
$("#bands").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  band = Number(b.dataset.i); document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); render();
});
$("#q").addEventListener("input", render);
$("#sort").addEventListener("change", render);
$("#clear").onclick = () => { picked.clear(); render(); };
$("#copy-handle").onclick = () => copy(DATA.discord, "Discord name copied");
$("#copy").onclick = () => {
  const cards = DATA.cards.filter(c => picked.has(c.sku)), total = cards.reduce((t, c) => t + c.price, 0);
  const lines = cards.map(c => `- ${c.sku} ${c.name} (${c.set} ${c.number}${c.finish ? ", " + c.finish : ""}) ${money(c.price)}`);
  copy(`Hi! I'd like these cards:\n${lines.join("\n")}\nTotal: ${money(total)} (${cards.length} card${cards.length > 1 ? "s" : ""})`,
       DATA.discord ? `Order copied - paste it in a DM to ${DATA.discord}` : "Order copied - paste it in a DM");
};
render();
</script>
